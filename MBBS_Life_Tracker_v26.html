// ── Firebase Auth + Firestore Sync ────────────────────────────────
function _applyFirestoreData(d) {
  if (!d) return;
  if (d.startDate  !== undefined) state.startDate  = d.startDate;
  if (d.scores     !== undefined) state.scores     = d.scores;
  if (d.overrides  !== undefined) state.overrides  = d.overrides;
  if (d.weekNotes  !== undefined) state.weekNotes  = d.weekNotes;
  if (d.weekPhotos !== undefined) state.weekPhotos = d.weekPhotos;
  if (d.letters    !== undefined) state.letters    = d.letters;
  if (d.exams      !== undefined) state.exams      = d.exams;
  localStorage.setItem("mbbs_start",     state.startDate);
  localStorage.setItem("mbbs_scores",    JSON.stringify(state.scores));
  localStorage.setItem("mbbs_overrides", JSON.stringify(state.overrides));
  localStorage.setItem("mbbs_notes",     JSON.stringify(state.weekNotes));
  localStorage.setItem("mbbs_photos",    JSON.stringify(state.weekPhotos));
  localStorage.setItem("mbbs_letters",   JSON.stringify(state.letters));
}

function _showSyncBadge(text, color) {
  let badge = document.getElementById("_fbSyncBadge");
  if (!badge) {
    badge = document.createElement("div");
    badge.id = "_fbSyncBadge";
    badge.style.cssText = "position:fixed;bottom:18px;left:50%;transform:translateX(-50%);padding:6px 16px;border-radius:20px;font-size:0.72rem;font-family:'Lora',Georgia,serif;font-style:italic;z-index:9999;pointer-events:none;transition:opacity 0.4s";
    document.body.appendChild(badge);
  }
  badge.textContent = text;
  badge.style.background = color === "ok" ? "rgba(16,185,129,0.15)" : color === "err" ? "rgba(239,68,68,0.15)" : "rgba(99,102,241,0.12)";
  badge.style.color       = color === "ok" ? "#10b981"              : color === "err" ? "#ef4444"              : "#6366f1";
  badge.style.border      = `1px solid ${color === "ok" ? "rgba(16,185,129,0.3)" : color === "err" ? "rgba(239,68,68,0.3)" : "rgba(99,102,241,0.25)"}`;
  badge.style.opacity     = "1";
  clearTimeout(badge._t);
  if (color === "ok") badge._t = setTimeout(() => { badge.style.opacity = "0"; }, 2200);
}

// ── After auth/guest: attach Firestore listener and enter app ─────
async function _updateAuthBar() {
  const bar = document.getElementById("_authStatusBar");
  if (!bar) return;
  const user = state._fbUser;
  if (user) {
    // Fetch current notification preference to show correct toggle label
    let notifEnabled = false;
    try {
      const doc = await _db.collection("users").doc(user.uid).get();
      notifEnabled = doc.data()?.notificationsEnabled ?? false;
    } catch (e) { /* ignore */ }
    const notifLabel = notifEnabled ? "🔔 Notifs on" : "🔕 Notifs off";
    bar.innerHTML = `<span style="color:var(--muted)">Signed in as <strong style="font-style:normal">${user.displayName || user.email}</strong> · <a onclick="toggleNotifications()" style="color:#6366f1;cursor:pointer;text-underline-offset:3px;text-decoration:underline">${notifLabel}</a> · <a onclick="_signOut()" style="color:#6366f1;cursor:pointer;text-underline-offset:3px;text-decoration:underline">Sign out</a></span>`;
  } else {
    bar.innerHTML = `<span>You're in guest mode — data saved locally only. <a onclick="_switchToGoogle()" style="color:#6366f1;cursor:pointer;text-underline-offset:3px;text-decoration:underline">Sign in with Google to sync</a></span>`;
  }
}

function _signOut() {
  if (!confirm("Sign out? Your data will stay saved locally.")) return;
  _auth.signOut().then(() => {
    state._fbUser = null;
    localStorage.removeItem("mbbs_auth_choice");
    localStorage.removeItem("mbbs_welcomed");
    location.reload();
  });
}

function _switchToGoogle() {
  const provider = new firebase.auth.GoogleAuthProvider();
  _auth.signInWithPopup(provider).then(result => {
    state._fbUser = result.user;
    _initFCM(result.user);   // request notification permission for this device
    localStorage.removeItem("mbbs_auth_choice");
    // Upload local data to this Google account
    _syncToFirestore();
    _updateAuthBar();
    _showSyncBadge("✓ Signed in & synced", "ok");
    // Start listening for future changes
    _db.collection("users").doc(result.user.uid).onSnapshot(snap => {
      if (snap.exists) _applyFirestoreData(snap.data());
      render();
    });
  }).catch(err => {
    console.warn("Switch to Google failed:", err);
    _showSyncBadge("Sign-in failed — allow popups and try again", "err");
  });
}

// ── FCM: Request permission and save token ────────────────────────
const VAPID_KEY = BO8iBosRezYjj4IYfFoB5Mldo1Q4DEHB-hAYV53i5MY168yRCbGUjynWqGtfLxtn1EMRz6gD8gg0ePjQHrvxOm0

async function _initFCM(user) {
  if (!user) return; // Only for signed-in users (guests can't receive server-side pushes)
  if (!("Notification" in window)) return; // Browser doesn't support notifications

  try {
    const messaging = firebase.messaging();

    // Request permission (browser will show native prompt)
    const permission = await Notification.requestPermission();
    if (permission !== "granted") return;

    // Get the FCM token for this device
    const token = await messaging.getToken({ vapidKey: VAPID_KEY });
    if (!token) return;

    // Save token to Firestore under the user's document
    await _db.collection("users").doc(user.uid).set({
      fcmTokens: firebase.firestore.FieldValue.arrayUnion(token),
      notificationsEnabled: true,
      updatedAt: Date.now()
    }, { merge: true });

    // Handle foreground messages (when app is open)
    messaging.onMessage((payload) => {
      // Show as a small in-app toast instead of a system notification
      _showSyncBadge("🔔 " + (payload.notification?.title || "New reminder"), "info");
    });

  } catch (err) {
    console.warn("FCM setup failed:", err);
  }
}

// ── FCM: Toggle notifications on/off ────────────────────────────
async function toggleNotifications() {
  const user = state._fbUser;
  if (!user) {
    alert("Sign in with Google to use notifications.");
    return;
  }

  try {
    const doc = await _db.collection("users").doc(user.uid).get();
    const current = doc.data()?.notificationsEnabled ?? false;
    const next = !current;

    await _db.collection("users").doc(user.uid).set({
      notificationsEnabled: next,
      updatedAt: Date.now()
    }, { merge: true });

    if (next) await _initFCM(user);

    _showSyncBadge(next ? "\uD83D\uDD14 Notifications on" : "\uD83D\uDD15 Notifications off", "ok");
    _updateAuthBar();
  } catch (err) {
    console.warn("Toggle notifications failed:", err);
    _showSyncBadge("Could not update notification setting", "err");
  }
}

function _enterApp(user) {
  const isFirstEverVisit = !localStorage.getItem("mbbs_welcomed");
  localStorage.setItem("mbbs_welcomed", "1");

  if (user) {
    state._fbUser = user;
    _initFCM(user); 
    _showSyncBadge("Signed in · syncing…", "info");
    _db.collection("users").doc(user.uid).onSnapshot(snap => {
      if (snap.exists) _applyFirestoreData(snap.data());
      if (!state._fbLoaded) {
        state._fbLoaded = true;
        render();
        _updateAuthBar();
        // Offer tutorial guide after a moment on first signed-in visit
        if (isFirstEverVisit) setTimeout(_showTutorialPrompt, 700);
      } else {
        render();
        _updateAuthBar();
      }
      _showSyncBadge("✓ Synced", "ok");
    }, err => {
      console.warn("Firestore listen error:", err);
      _showSyncBadge("Offline — data saved locally", "err");
      if (!state._fbLoaded) { state._fbLoaded = true; render(); _updateAuthBar(); }
    });
  } else {
    // Guest mode — local only
    state._fbLoaded = true;
    render();
    _updateAuthBar();
    if (isFirstEverVisit) setTimeout(_showTutorialPrompt, 700);
  }
}

function _nextTutStep() {
  _tutStep++;
  _tutNavigatingBack = false;
  if (_tutStep >= TUT_STEPS.length) {
    _closeTutorial();
    return;
  }
  _tutWaitingForAction = false;
  _renderTutorialStep();
}

function _renderTutorialStep() {
  if (!_tutActive) return;
  const step = TUT_STEPS[_tutStep];
  if (!step) { _closeTutorial(); return; }

  // Cancel any pending observer from previous step
  if (_tutActiveObserver) { _tutActiveObserver.disconnect(); _tutActiveObserver = null; }
  _tutWaitingForAction = false;

  // Remove tooltip immediately
  document.getElementById("_tutTooltip")?.remove();

  // Determine if this step uses a ring
  const hasRing = !step.noRing && !!step.spotlight;

  if (hasRing) {
    const targetEl = step.spotlight();
    if (targetEl) {
      const scrollTarget = step.scrollToFocus
        ? (document.querySelector("[data-focus-year]") || targetEl)
        : targetEl;
      scrollTarget.scrollIntoView({ behavior: "smooth", block: "center" });

      // Get or create ring NOW before the delay so it exists in DOM during scroll
      let ring = document.getElementById("_tutRing");
      const isNewRing = !ring;
      if (!ring) {
        ring = document.createElement("div");
        ring.id = "_tutRing";
        ring.className = "tut-highlight-ring";
        ring.style.opacity = "0";
        ring.style.transition = "none";
        document.body.appendChild(ring);
      }
      ring.style.display = "";

      const delay = step.scrollToFocus ? 600 : 350;
      setTimeout(() => {
        if (!_tutActive) return;
        const el = step.spotlight ? step.spotlight() : null;
        if (!el) { _createTooltip(step, null); return; }
        const rect = el.getBoundingClientRect();
        const pad = 10;
        const spotRect = {
          top: rect.top - pad,
          left: rect.left - pad,
          width: rect.width + pad * 2,
          height: rect.height + pad * 2,
        };
        const r = document.getElementById("_tutRing");
        if (!r) { _createTooltip(step, spotRect); return; }

        if (isNewRing || r.style.opacity === "0") {
          // First appearance: snap to position, then fade in
          r.style.transition = "none";
          r.style.top    = spotRect.top    + "px";
          r.style.left   = spotRect.left   + "px";
          r.style.width  = spotRect.width  + "px";
          r.style.height = spotRect.height + "px";
          r.getBoundingClientRect(); // force reflow
          r.style.transition = "opacity 0.25s ease, top 0.35s cubic-bezier(0.4,0,0.2,1), left 0.35s cubic-bezier(0.4,0,0.2,1), width 0.35s cubic-bezier(0.4,0,0.2,1), height 0.35s cubic-bezier(0.4,0,0.2,1)";
          r.style.opacity = "1";
        } else {
          // Ring already visible — animate smoothly to new position
          r.style.transition = "opacity 0.25s ease, top 0.35s cubic-bezier(0.4,0,0.2,1), left 0.35s cubic-bezier(0.4,0,0.2,1), width 0.35s cubic-bezier(0.4,0,0.2,1), height 0.35s cubic-bezier(0.4,0,0.2,1)";
          r.style.top    = spotRect.top    + "px";
          r.style.left   = spotRect.left   + "px";
          r.style.width  = spotRect.width  + "px";
          r.style.height = spotRect.height + "px";
        }
        _createTooltip(step, spotRect);
      }, delay);
    } else {
      // Target not found — hide ring and show tooltip without it
      const existingRing = document.getElementById("_tutRing");
      if (existingRing) {
        existingRing.style.opacity = "0";
        setTimeout(() => document.getElementById("_tutRing")?.remove(), 280);
      }
      _createTooltip(step, null);
    }
  } else {
    // No ring for this step — fade out and remove any existing ring
    const existingRing = document.getElementById("_tutRing");
    if (existingRing) {
      existingRing.style.transition = "opacity 0.25s ease";
      existingRing.style.opacity = "0";
      setTimeout(() => document.getElementById("_tutRing")?.remove(), 280);
    }
    _createTooltip(step, null);
  }

  // Set up watchers for action steps
  // Special case: when going BACK to full_overview (step 6), skip auto-advance since
  // we're already on the overview screen — the user must manually click the button or Next
  if (step.waitFor) {
    if (step.id === "full_overview" && _tutNavigatingBack) {
      _tutNavigatingBack = false;
      // Do NOT set up watcher; user clicks Next or the sidebar btn manually
    } else {
      _tutWaitingForAction = true;
      _watchForAction(step.waitFor);
    }
  }
}

function _createTooltip(step, spotRect) {
  const tip = document.createElement("div");
  tip.id = "_tutTooltip";
  tip.className = "tut-tooltip";

  const dots = TUT_STEPS.map((_, i) => {
    let cls = "tut-tooltip-dot";
    if (i < _tutStep) cls += " done";
    else if (i === _tutStep) cls += " active";
    return `<span class="${cls}"></span>`;
  }).join("");

  const actionHtml = step.action
    ? `<div class="tut-tooltip-action">
        <span class="tut-waiting-pulse"></span>
        ${step.action}
       </div>`
    : "";

  const isFirst = _tutStep === 0;
  const isLast = step.isLast;
  // Steps 1, 2 & 4 wait for user action — show "Skip this step" since the action triggers auto-advance
  // All other steps: show "Next →" or "Finish tour ✓"
  const isActionGated = step.waitFor === "date_selected" || step.waitFor === "calendar_built" || step.waitFor === "week_clicked";
  const nextLabel = isLast ? "Finish tour ✓" : (isActionGated ? "Skip this step" : "Next →");

  const backHtml = !isFirst
    ? `<button class="tut-btn-back" id="_tutBackBtn">← Back</button>`
    : "";

  const exitHtml = !isFirst
    ? `<button class="tut-btn-skip-inline" id="_tutExitBtn">Exit tour</button>`
    : "";

  tip.innerHTML = `
    <div class="tut-tooltip-eyebrow">${step.eyebrow}</div>
    <div class="tut-tooltip-title">${step.title}</div>
    <div class="tut-tooltip-body">${step.body}</div>
    ${actionHtml}
    <div class="tut-tooltip-footer">
      <div class="tut-tooltip-progress">${dots}</div>
      <div style="display:flex;gap:8px;align-items:center">
        ${exitHtml}
        ${backHtml}
        <button class="tut-btn-next" id="_tutNextBtn">${nextLabel}</button>
      </div>
    </div>`;

  document.body.appendChild(tip);

  // Position tooltip first (invisible), then fade in
  _positionTooltip(tip, spotRect, step);

  // Trigger fade-in on next frame
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      tip.classList.add("tut-tooltip-visible");
    });
  });

  document.getElementById("_tutNextBtn").addEventListener("click", () => {
    if (isLast) { _closeTutorial(); return; }
    _tutWaitingForAction = false;
    // If user skips step 1 (date) or step 2 (build), end the tour — nothing to show
    if (step.waitFor === "date_selected" || step.waitFor === "calendar_built") { _closeTutorial(); return; }
    _nextTutStep();
  });

  const backBtn = document.getElementById("_tutBackBtn");
  if (backBtn) backBtn.addEventListener("click", () => {
    _tutWaitingForAction = false;
    _tutNavigatingBack = true;
    _tutStep = Math.max(0, _tutStep - 1);
    _renderTutorialStep();
  });

  const exitBtn = document.getElementById("_tutExitBtn");
  if (exitBtn) exitBtn.addEventListener("click", _closeTutorial);
}

function _positionTooltip(tip, spotRect, step) {
  const vpW = window.innerWidth;
  const vpH = window.innerHeight;
  const tW = Math.min(300, vpW - 32);
  // Measure actual rendered height, fallback to estimate
  const tH = tip.offsetHeight || 260;

  let top, left;

  if (spotRect) {
    const spotBottom = spotRect.top + spotRect.height;
    const spotCenterX = spotRect.left + spotRect.width / 2;
    const spaceBelow = vpH - spotBottom;
    const spaceAbove = spotRect.top;
    const rightSpace = vpW - (spotRect.left + spotRect.width);
    const leftSpace = spotRect.left;

    // If step explicitly asks for a side position, honour it first
    const preferredPos = step?.tooltipPos;
    if (preferredPos === "right" && rightSpace >= tW + 20) {
      left = spotRect.left + spotRect.width + 16;
      top = Math.max(16, Math.min(vpH - tH - 16, spotRect.top + spotRect.height / 2 - tH / 2));
      tip.style.top = top + "px";
      tip.style.left = left + "px";
      tip.style.width = tW + "px";
      return;
    } else if (preferredPos === "right" && leftSpace >= tW + 20) {
      // Fall back to left if right has no room
      left = spotRect.left - tW - 16;
      top = Math.max(16, Math.min(vpH - tH - 16, spotRect.top + spotRect.height / 2 - tH / 2));
      tip.style.top = top + "px";
      tip.style.left = left + "px";
      tip.style.width = tW + "px";
      return;
    } else if (preferredPos === "right") {
      // Neither side has room — fall through to vertical placement below
    }

    if (spaceBelow >= tH + 20) {
      top = spotBottom + 16;
    } else if (spaceAbove >= tH + 20) {
      top = spotRect.top - tH - 16;
    } else {
      if (rightSpace >= tW + 20) {
        left = spotRect.left + spotRect.width + 16;
        top = Math.max(16, Math.min(vpH - tH - 16, spotRect.top + spotRect.height / 2 - tH / 2));
        tip.style.top = top + "px";
        tip.style.left = left + "px";
        tip.style.width = tW + "px";
        return;
      } else if (leftSpace >= tW + 20) {
        left = spotRect.left - tW - 16;
        top = Math.max(16, Math.min(vpH - tH - 16, spotRect.top + spotRect.height / 2 - tH / 2));
        tip.style.top = top + "px";
        tip.style.left = left + "px";
        tip.style.width = tW + "px";
        return;
      } else {
        top = spaceBelow >= spaceAbove
          ? Math.min(spotBottom + 16, vpH - tH - 16)
          : Math.max(16, spotRect.top - tH - 16);
      }
    }
    left = Math.max(16, Math.min(vpW - tW - 16, spotCenterX - tW / 2));
  } else {
    const preferredPos = step?.tooltipPos;
    if (preferredPos === "bottom-left") {
      // Position card at bottom-left corner (sidebar area)
      top = Math.max(16, vpH - tH - 40);
      left = 16;
    } else if (preferredPos === "bottom-right") {
      // Position card at bottom-right corner
      top = Math.max(16, vpH - tH - 40);
      left = Math.max(16, vpW - tW - 16);
    } else {
      top = Math.max(16, vpH - tH - 40);
      left = Math.max(16, Math.min(vpW - tW - 16, (vpW - tW) / 2));
    }
  }

  tip.style.top = top + "px";
  tip.style.left = left + "px";
  tip.style.width = tW + "px";
}

function _waitForWeekModalClose() {
  if (!_tutActive) return;
  // The week rating modal uses id="modalBackdrop"
  let checkCount = 0;
  const waitForOpen = setInterval(() => {
    checkCount++;
    const modal = document.getElementById("modalBackdrop");
    if (modal || checkCount > 20) {
      clearInterval(waitForOpen);
      if (!modal) {
        // Modal never appeared — advance immediately
        setTimeout(_nextTutStep, 300);
        return;
      }
      // Modal is open — watch for it to be removed from DOM
      const obs = new MutationObserver(() => {
        if (!_tutActive) { obs.disconnect(); return; }
        if (!document.getElementById("modalBackdrop")) {
          obs.disconnect();
          // Modal closed — resume the tour
          setTimeout(_nextTutStep, 500);
        }
      });
      obs.observe(document.body, { childList: true, subtree: true });
    }
  }, 100);
}

function _watchForAction(actionType) {
  if (actionType === "date_selected") {
    const inp = document.getElementById("dateInput");
    if (!inp) return;
    // Remove any previously attached handler to avoid duplicates after re-render
    if (inp._tutHandler) {
      inp.removeEventListener("change", inp._tutHandler);
      inp.removeEventListener("input", inp._tutHandler);
    }
    const handler = () => {
      if (!_tutWaitingForAction) return;
      if (inp.value) {
        _tutWaitingForAction = false;
        inp.removeEventListener("change", handler);
        inp.removeEventListener("input", handler);
        inp._tutHandler = null;
        setTimeout(_nextTutStep, 600);
      }
    };
    inp._tutHandler = handler;
    inp.addEventListener("change", handler);
    inp.addEventListener("input", handler);
  }

  else if (actionType === "calendar_built") {
    // Watch for the build button click
    const btn = document.getElementById("buildBtn");
    if (!btn) return;
    const handler = () => {
      if (!_tutWaitingForAction) return;
      _tutWaitingForAction = false;
      btn.removeEventListener("click", handler);
      // Wait for render to complete
      setTimeout(() => {
        _nextTutStep();
      }, 800);
    };
    btn.addEventListener("click", handler);
    // Also watch if calendar already built (startDate set)
    if (state.startDate) {
      setTimeout(() => {
        if (_tutWaitingForAction && document.querySelector(".year-section")) {
          _tutWaitingForAction = false;
          _nextTutStep();
        }
      }, 300);
    }
  }

  else if (actionType === "week_clicked") {
    // When user clicks a week cell, hide the ring and tooltip — pause the tour
    // Resume (advance to next step) only when the week modal is closed
    const attachClickWatcher = () => {
      document.querySelectorAll(".week-cell.clickable").forEach(cell => {
        if (cell._tutClickHandler) return; // already attached
        const h = () => {
          if (!_tutWaitingForAction) return;
          _tutWaitingForAction = false;
          // Remove ring and fade tooltip — tour is paused while modal is open
          const ring = document.getElementById("_tutRing");
          if (ring) ring.remove();
          const tip = document.getElementById("_tutTooltip");
          if (tip) tip.style.opacity = "0";
          // Wait for the modal to appear, then watch for it to close
          setTimeout(() => {
            _waitForWeekModalClose();
          }, 400);
        };
        cell._tutClickHandler = h;
        cell.addEventListener("click", h, { once: true });
      });
    };
    attachClickWatcher();
    // Also observe DOM in case grid re-renders
    const obs = new MutationObserver(() => {
      if (!_tutWaitingForAction) { obs.disconnect(); return; }
      attachClickWatcher();
    });
    obs.observe(document.body, { childList: true, subtree: true });
  }

  else if (actionType === "year_focused") {
    // Watch for year view root to appear
    const observer = new MutationObserver(() => {
      if (!_tutWaitingForAction) return;
      if (document.getElementById("yearViewRoot")) {
        _tutWaitingForAction = false;
        observer.disconnect();
        setTimeout(_nextTutStep, 600);
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  }

  else if (actionType === "overview_opened") {
    // If already on overview (no yearViewRoot) AND not navigating back, advance immediately
    if (!document.getElementById("yearViewRoot") && !_tutNavigatingBack) {
      _tutWaitingForAction = false;
      setTimeout(_nextTutStep, 400);
      return;
    }
    // If navigating back, just clear the flag and wait for user to click Overview
    _tutNavigatingBack = false;
    // Watch for yearViewRoot to be removed (user clicked ← Overview)
    const observer = new MutationObserver(() => {
      if (!_tutWaitingForAction) return;
      if (!document.getElementById("yearViewRoot")) {
        _tutWaitingForAction = false;
        observer.disconnect();
        setTimeout(_nextTutStep, 600);
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  }
}

// Re-render spotlight on scroll/resize during tutorial
window.addEventListener("scroll", () => {
  if (!_tutActive) return;
  clearTimeout(window._tutScrollTimer);
  window._tutScrollTimer = setTimeout(() => {
    if (!_tutActive) return;
    // Always just reposition existing elements — never re-create (avoids flicker/lag)
    const step = TUT_STEPS[_tutStep];
    const targetEl = step?.spotlight?.();
    if (targetEl) {
      const rect = targetEl.getBoundingClientRect();
      const pad = 10;
      const spotRect = { top: rect.top-pad, left: rect.left-pad, width: rect.width+pad*2, height: rect.height+pad*2 };
      const ring = document.getElementById("_tutRing");
      const tip  = document.getElementById("_tutTooltip");
      if (ring && ring.style.display !== "none") { ring.style.top=spotRect.top+"px"; ring.style.left=spotRect.left+"px"; ring.style.width=spotRect.width+"px"; ring.style.height=spotRect.height+"px"; }
      if (tip)  _positionTooltip(tip, spotRect, step);
    }
  }, 120);
}, { passive: true });

// ── Pause tour on unexpected clicks outside tour UI ───────────────
document.addEventListener("click", (e) => {
  if (!_tutActive || _tutPaused) return;

  // Allow clicks on: the tooltip, the ring, the pause backdrop, week cells (step 4 expects them),
  // action-gated elements (date input, build btn, sidebar btn), and any step that explicitly waits for a click
  const step = TUT_STEPS[_tutStep];
  const tip  = document.getElementById("_tutTooltip");
  const ring = document.getElementById("_tutRing");
  const pauseBackdrop = document.getElementById("_tutPauseBackdrop");

  if (pauseBackdrop && pauseBackdrop.contains(e.target)) return; // clicking pause dialog itself
  if (tip  && tip.contains(e.target))  return; // clicking the tooltip
  if (ring && ring.contains(e.target)) return; // clicking the ring

  // Steps that require a user action (clicking something specific) — allow those targets
  if (step.waitFor === "week_clicked") {
    // Clicking a week cell is the expected action — don't pause
    if (e.target.closest(".week-cell")) return;
  }
  if (step.waitFor === "overview_opened") {
    // Clicking the sidebar overview button is the expected action — don't pause
    if (e.target.closest("#sidebarMainBtn") || e.target.id === "sidebarMainBtn") return;
  }
  if (step.waitFor === "date_selected") {
    // Clicking/interacting with date input is expected — don't pause
    if (e.target.closest(".card") || e.target.id === "dateInput") return;
  }
  if (step.waitFor === "calendar_built") {
    // Clicking the build button is expected — don't pause
    if (e.target.id === "buildBtn" || e.target.closest("#buildBtn")) return;
  }

  // Also allow theme toggle and other utility buttons that shouldn't break the tour
  if (e.target.id === "themeToggle") return;

  // Any other click is "unexpected" — pause the tour
  _pauseTutorial();
}, true); // capture phase so we see it before other handlers

// ── Boot: check if already authenticated or has made a choice ─────
_auth.onAuthStateChanged(user => {
  if (user) {
    // Already signed in (returning user) — skip welcome screen
    _enterApp(user);
  } else {
    const priorChoice = localStorage.getItem("mbbs_auth_choice");
    if (priorChoice === "guest") {
      // Returning guest — go straight in
      _enterApp(null);
    } else {
      // New visitor — show welcome screen
      _showWelcomeScreen();
    }
  }
});
</script>
